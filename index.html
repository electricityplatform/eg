<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.75, viewport-fit=cover">
    <meta name="theme-color" content="#3a332b">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <title>Electricity</title>
    <script>
        (function () {
            var t = 'system';
            try { t = localStorage.getItem('theme') || 'system'; } catch (e) {}
            var dark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (dark) document.documentElement.classList.add('dark');
        })();
    </script>
    <script>
        // جسر بين نظام الثيم القديم (كلاس dark على html) وثيمات DaisyUI.
        // أي كود بيضيف/يشيل كلاس dark (زي شاشة الإعدادات) هيبدّل ثيم المكتبة تلقائياً.
        (function () {
            var root = document.documentElement;
            function sync() {
                var dark = root.classList.contains('dark');
                root.setAttribute('data-theme', dark ? 'electricity-dark' : 'electricity-light');
                // لون شريط المتصفح (بيتغيّر مع الوضع)
                var m = document.querySelector('meta[name="theme-color"]');
                if (m) m.setAttribute('content', dark ? '#1b1b1e' : '#3a332b');
            }
            sync();
            new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ['class'] });
        })();
    </script>

    <!-- الخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- DaisyUI: مكتبة المكوّنات (أزرار، كروت، قوائم، تابات، ثيمات) -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // ربط ألوان DaisyUI بـ Tailwind: تقدر تكتب bg-primary / text-base-content/60 ... في أي ملف.
        // وكمان blue-* القديمة اتحوّلت للون العلامة، فالشاشات اللي مش مرفوعة هنا بتتوحّد معاها.
        const dz = (v) => `oklch(var(${v}) / <alpha-value>)`;
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: dz('--p'), 'primary-content': dz('--pc'),
                        secondary: dz('--s'), 'secondary-content': dz('--sc'),
                        accent: dz('--a'), 'accent-content': dz('--ac'),
                        neutral: dz('--n'), 'neutral-content': dz('--nc'),
                        'base-100': dz('--b1'), 'base-200': dz('--b2'), 'base-300': dz('--b3'), 'base-content': dz('--bc'),
                        info: dz('--in'), success: dz('--su'), warning: dz('--wa'), error: dz('--er'),
                        'info-content': dz('--inc'), 'success-content': dz('--suc'), 'warning-content': dz('--wac'), 'error-content': dz('--erc'),
                        blue: {
                            50: '#E8F7F8', 100: '#CDEEF0', 200: '#A3E0E4', 300: '#6FCBD2', 400: '#3DB0B9',
                            500: '#1A97A2', 600: '#027F8A', 700: '#05707A', 800: '#085C64', 900: '#0B4850'
                        }
                    },
                    fontFamily: { sans: ['"IBM Plex Sans Arabic"', '"Segoe UI"', 'Tahoma', 'sans-serif'] }
                }
            }
        };
    </script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- SheetJS للتصدير إلى XLSX -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- التنسيقات -->
    <link rel="stylesheet" href="style.css?v=20261101-2">
    <link rel="stylesheet" href="theme.css?v=20261104-18">
</head>

    <script>
        // تسجيل الـ service worker: بيخلي التطبيق يفتح ويتحدّث حتى لو مفيش نت (بعد أول زيارة بنت شغال)
        if ('serviceWorker' in navigator) {
            var hadController = !!navigator.serviceWorker.controller;

            // لما نسخة جديدة تاخد مكان القديمة: نظهر شريط "فيه تحديث جديد" (مش في أول تثبيت)
            navigator.serviceWorker.addEventListener('controllerchange', function () {
                if (!hadController) { hadController = true; return; }
                if (document.getElementById('updateBanner')) return;
                var b = document.createElement('div');
                b.id = 'updateBanner';
                b.className = 'conn-banner online';
                b.innerHTML = 'فيه تحديث جديد<button type="button" onclick="location.reload()">تحديث</button>';
                document.body.appendChild(b);
            });

            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').then(function (reg) {
                    // نفحص عن تحديث كل ما ترجع للتطبيق
                    document.addEventListener('visibilitychange', function () {
                        if (!document.hidden) reg.update().catch(function () {});
                    });
                }).catch(function () {});
            });
        }
    </script>
