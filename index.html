<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>iPhone 3D - فك وتركيب قطع الغيار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#0b1020; --bg2:#1b2340; --card:rgba(18,24,48,.78); --line:rgba(255,255,255,.12);
    --accent:#4f8cff; --text:#eef2ff; --muted:#9aa6c7;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Cairo',system-ui,Tahoma,sans-serif;color:var(--text);
    background:radial-gradient(1200px 800px at 50% 40%,var(--bg2),var(--bg1))}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas#c:active{cursor:grabbing}
  header{position:fixed;top:0;left:0;right:0;padding:14px 18px;pointer-events:none;z-index:5}
  header h1{margin:0;font-size:20px;font-weight:800}
  header p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  .glass{background:var(--card);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px}
  #list{position:fixed;top:78px;right:14px;width:230px;max-height:calc(100% - 190px);overflow:auto;padding:8px;z-index:5}
  #list h3{margin:6px 8px 8px;font-size:13px;color:var(--muted);font-weight:600}
  .item{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;margin:2px 0;border:0;border-radius:10px;
    background:transparent;color:var(--text);font:inherit;font-size:14.5px;text-align:right;cursor:pointer;transition:.15s}
  .item:hover{background:rgba(255,255,255,.08)}
  .item.active{background:var(--accent);color:#fff}
  .item .n{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:12px;font-weight:600}
  .item.active .n{background:rgba(255,255,255,.28)}
  #info{position:fixed;top:78px;left:14px;width:270px;padding:14px 16px;z-index:5;display:none}
  #info h2{margin:0 0 6px;font-size:18px}
  #info p{margin:0;font-size:13.5px;line-height:1.8;color:#cfd7f3}
  #bar{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:6;display:flex;align-items:center;gap:10px;
    padding:10px 14px;max-width:calc(100% - 20px);flex-wrap:wrap;justify-content:center}
  #bar label{font-size:13px;color:var(--muted)}
  #bar input[type=range]{width:200px;accent-color:var(--accent);direction:ltr}
  .btn{border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);font:inherit;font-size:13px;
    padding:7px 12px;border-radius:10px;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{background:rgba(255,255,255,.15)}
  .btn.on{background:var(--accent);border-color:var(--accent)}
  #labels{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:hidden}
  .tag{position:absolute;transform:translate(-50%,-50%);padding:2px 8px;border-radius:999px;font-size:12px;white-space:nowrap;
    background:rgba(10,14,30,.82);border:1px solid var(--line);color:#fff;display:none}
  .tag.hl{background:var(--accent);border-color:var(--accent)}
  #loading{position:fixed;inset:0;display:grid;place-items:center;z-index:20;background:var(--bg1);transition:opacity .6s;font-size:16px;color:var(--muted)}
  #hint{position:fixed;bottom:92px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);pointer-events:none;z-index:3}
  @media (max-width:760px){
    header h1{font-size:16px} header p{display:none}
    #list{top:auto;bottom:104px;right:0;left:0;width:auto;max-height:none;border-radius:0;display:flex;overflow-x:auto;overflow-y:hidden;gap:6px;padding:8px}
    #list h3{display:none}
    .item{width:auto;flex:none;border:1px solid var(--line);padding:6px 12px;font-size:13.5px}
    #info{top:50px;left:10px;right:10px;width:auto;padding:10px 14px}
    #info p{font-size:12.5px;line-height:1.7}
    #bar{bottom:8px;padding:8px 10px}
    #bar input[type=range]{width:140px}
    #hint{display:none}
  }
</style>
</head>
<body>
<div id="loading">جاري تحميل المجسم ثلاثي الأبعاد...</div>
<canvas id="c"></canvas>
<div id="labels"></div>

<header>
  <h1>iPhone — فك وتركيب قطع الغيار 3D</h1>
  <p>اسحب للتدوير • اقرص أو استخدم العجلة للتكبير • اضغط على أي قطعة لمعرفة تفاصيلها</p>
</header>

<aside id="list" class="glass"><h3>قطع الغيار (13)</h3></aside>
<div id="info" class="glass"><h2></h2><p></p></div>

<div id="bar" class="glass">
  <label for="ex">تركيب</label>
  <input id="ex" type="range" min="0" max="1" step="0.001" value="0">
  <label for="ex">فك</label>
  <button class="btn" id="bAuto">فك/تركيب تلقائي</button>
  <button class="btn" id="bSpin">دوران</button>
  <button class="btn" id="bTags">الأسماء</button>
  <button class="btn" id="bReset">إعادة ضبط</button>
</div>
<div id="hint">اضغط على القطعة لعزلها — اضغط مرة أخرى للإلغاء</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============ المشهد ============ */
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 200);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 12;
controls.maxDistance = 70;
controls.autoRotateSpeed = 1.6;

const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(10, 14, 16); scene.add(key);
const rim = new THREE.DirectionalLight(0x88aaff, 1.0); rim.position.set(-12, 4, -14); scene.add(rim);
scene.add(new THREE.AmbientLight(0xffffff, 0.35));

// ظل أرضية ناعم
{
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d'); const gr = g.createRadialGradient(64,64,4,64,64,64);
  gr.addColorStop(0,'rgba(0,0,0,.55)'); gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0,0,128,128);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(26,26),
    new THREE.MeshBasicMaterial({ map:new THREE.CanvasTexture(c), transparent:true, depthWrite:false }));
  m.rotation.x = -Math.PI/2; m.position.y = -9.5; scene.add(m);
}

const phone = new THREE.Group();
scene.add(phone);

/* ============ أدوات مساعدة ============ */
const M = (color, metalness=0.2, roughness=0.5, extra={}) =>
  new THREE.MeshStandardMaterial({ color, metalness, roughness, ...extra });

function rrPath(p, w, h, r){
  const x=-w/2, y=-h/2;
  p.moveTo(x+r,y); p.lineTo(x+w-r,y); p.quadraticCurveTo(x+w,y,x+w,y+r);
  p.lineTo(x+w,y+h-r); p.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  p.lineTo(x+r,y+h); p.quadraticCurveTo(x,y+h,x,y+h-r);
  p.lineTo(x,y+r); p.quadraticCurveTo(x,y,x+r,y);
  return p;
}
function ext(shape, depth, mat, bevel=0.03){
  const g = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled:true, bevelSize:bevel, bevelThickness:bevel, bevelSegments:2, curveSegments:14 });
  g.translate(0,0,-depth/2);
  return new THREE.Mesh(g, mat);
}
const box = (w,h,d,mat,x=0,y=0,z=0) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w,h,d), mat); m.position.set(x,y,z); return m; };
const cyl = (r,h,mat,x=0,y=0,z=0) => { const g = new THREE.CylinderGeometry(r,r,h,32); g.rotateX(Math.PI/2); const m = new THREE.Mesh(g, mat); m.position.set(x,y,z); return m; };
function uvShape(shape, w, h){
  const g = new THREE.ShapeGeometry(shape, 16);
  const p = g.attributes.position, uv = g.attributes.uv;
  for(let i=0;i<p.count;i++) uv.setXY(i, p.getX(i)/w+0.5, p.getY(i)/h+0.5);
  return g;
}
function canvasTex(w,h,draw){
  const c = document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}

/* ============ الخامات ============ */
const frameMetal = () => M(0x8d9bb8, 1.0, 0.32);
const backGlass  = () => M(0x2c3b5c, 0.3, 0.18);
const flexMat    = () => M(0xe3a23b, 0.15, 0.6, { side:THREE.DoubleSide });
const darkPlastic= () => M(0x15171c, 0.1, 0.55);
const steel      = () => M(0xcfd3da, 0.95, 0.28);
const black      = () => new THREE.MeshBasicMaterial({ color:0x000000 });

/* ============ بناء القطع ============ */
const W=7.2, H=15;

function buildScreen(){
  const g = new THREE.Group();
  g.add(ext(rrPath(new THREE.Shape(),6.7,14.4,0.95), 0.08, M(0x07080b,0.6,0.15)));
  const tex = canvasTex(520,1136,(c,w,h)=>{
    const gr = c.createLinearGradient(0,0,w,h);
    gr.addColorStop(0,'#1d4ed8'); gr.addColorStop(.5,'#7c3aed'); gr.addColorStop(1,'#f97316');
    c.fillStyle=gr; c.fillRect(0,0,w,h);
    const blob=(x,y,r,col)=>{const rg=c.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,col);rg.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=rg;c.fillRect(0,0,w,h)};
    blob(120,260,380,'rgba(56,189,248,.55)'); blob(420,820,420,'rgba(244,114,182,.5)'); blob(300,560,300,'rgba(255,255,255,.18)');
    c.fillStyle='#fff'; c.textAlign='center';
    c.font='700 150px Cairo, Arial'; c.fillText('9:41', w/2, 420);
    c.font='600 34px Cairo, Arial'; c.fillText('الثلاثاء', w/2, 300);
    c.fillStyle='rgba(255,255,255,.9)'; c.fillRect(w/2-90,h-36,180,8);
  });
  const face = new THREE.Mesh(uvShape(rrPath(new THREE.Shape(),6.5,14.2,0.85),6.5,14.2), new THREE.MeshBasicMaterial({ map:tex }));
  face.position.z = 0.075; g.add(face);
  const isl = new THREE.Mesh(new THREE.ShapeGeometry(rrPath(new THREE.Shape(),1.8,0.5,0.25),12), black());
  isl.position.set(0,6.35,0.08); g.add(isl);
  return g;
}
function buildScreenFlex(){
  const g = new THREE.Group();
  g.add(box(3.4,2.4,0.03,flexMat()));
  g.add(box(2.4,1.0,0.05,M(0x2a2d35,0.2,0.6),0,0.35,0.04));
  g.add(box(1.7,0.45,0.1,darkPlastic(),0,-1.3,0.05));
  for(let i=-3;i<=3;i++) g.add(box(0.06,1.1,0.01,M(0xffd27a,0.9,0.3),i*0.2,-0.55,0.02));
  return g;
}
function buildEarpiece(){
  const g = new THREE.Group();
  g.add(box(2.0,0.42,0.26,darkPlastic()));
  g.add(box(1.6,0.14,0.02,steel(),0,0,0.14));
  g.add(cyl(0.07,0.05,M(0x0b0c10),1.3,0,0.12));
  return g;
}
function buildFrame(){
  const g = new THREE.Group();
  const s = rrPath(new THREE.Shape(), W, H, 1.0);
  s.holes.push(rrPath(new THREE.Path(), 6.8, 14.6, 0.8));
  g.add(ext(s, 0.8, frameMetal(), 0.04));
  const bm = M(0x9aa7c2,1,0.35);
  g.add(box(0.14,0.9,0.14,bm,-3.62,5.4,0));
  g.add(box(0.14,1.3,0.14,bm,-3.62,3.4,0));
  g.add(box(0.14,1.3,0.14,bm,-3.62,1.8,0));
  g.add(box(0.14,1.8,0.14,bm,3.62,2.6,0));
  g.add(box(0.14,1.2,0.14,M(0x20232b,0.6,0.3),3.62,-2.6,0));
  return g;
}
function buildMiddle(){
  const g = new THREE.Group();
  const s = rrPath(new THREE.Shape(), 6.7, 14.4, 0.8);
  const hole = new THREE.Path();
  const hx=-2.0, hy=-1.5-3.3, hw=4.0, hh=6.6, hr=0.3;
  hole.moveTo(hx+hr,hy); hole.lineTo(hx+hw-hr,hy); hole.quadraticCurveTo(hx+hw,hy,hx+hw,hy+hr);
  hole.lineTo(hx+hw,hy+hh-hr); hole.quadraticCurveTo(hx+hw,hy+hh,hx+hw-hr,hy+hh);
  hole.lineTo(hx+hr,hy+hh); hole.quadraticCurveTo(hx,hy+hh,hx,hy+hh-hr);
  hole.lineTo(hx,hy+hr); hole.quadraticCurveTo(hx,hy,hx+hr,hy);
  s.holes.push(hole);
  const mesh = ext(s, 0.08, M(0x666b75,0.9,0.4), 0.02);
  g.add(mesh);
  // العلبة المعدنية العلوية للكاميرا (منطقة اللوجيك)
  g.add(box(2.6,1.0,0.05,M(0x8a8f99,0.9,0.35),1.6,5.4,0.06));
  const sc = M(0xc7ccd4,1,0.25);
  [[-2.8,6.4],[2.8,6.4],[-2.8,-6.4],[2.8,-6.4],[-3.0,0.5],[3.0,0.5]].forEach(([x,y])=> g.add(cyl(0.11,0.05,sc,x,y,0.06)));
  return g;
}
function buildSocket(){
  const g = new THREE.Group();
  g.add(box(0.42,1.7,0.5,steel()));
  g.add(box(0.44,1.25,0.18,darkPlastic(),0,0,0));
  g.add(box(0.1,0.35,0.52,M(0xd9b24a,0.9,0.3),-0.1,0.6,0));
  return g;
}
function buildPowerFlex(){
  const g = new THREE.Group();
  g.add(box(0.7,3.2,0.03,flexMat()));
  g.add(box(0.55,0.55,0.1,M(0xd9b24a,0.9,0.3),0.08,1.2,0.04));
  g.add(box(0.5,0.4,0.1,darkPlastic(),-0.05,-1.6,0.04));
  return g;
}
function buildBattery(){
  const g = new THREE.Group();
  g.add(ext(rrPath(new THREE.Shape(),3.8,6.4,0.3), 0.24, M(0xbfc4cc,0.6,0.4), 0.02));
  const tex = canvasTex(256,420,(c,w,h)=>{
    c.fillStyle='#e9ecf1'; c.fillRect(0,0,w,h);
    c.fillStyle='#111'; c.textAlign='center';
    c.font='700 42px Arial'; c.fillText('Li-Ion',w/2,110);
    c.font='600 22px Arial'; c.fillText('BATTERY',w/2,150);
    c.fillStyle='#16a34a'; c.fillRect(w/2-50,200,100,46);
    c.fillStyle='#16a34a'; c.fillRect(w/2+50,214,10,18);
    c.fillStyle='#fff'; c.font='700 24px Arial'; c.fillText('+ −',w/2,234);
    for(let i=0;i<14;i++){c.fillStyle='#111';c.fillRect(30+i*14,300,8,i%3?50:36)}
  });
  const lab = new THREE.Mesh(new THREE.PlaneGeometry(3.3,5.4), new THREE.MeshStandardMaterial({ map:tex, roughness:.6 }));
  lab.rotation.y = Math.PI; lab.position.z = -0.14; g.add(lab);
  const front = new THREE.Mesh(new THREE.PlaneGeometry(3.3,5.4), M(0xaab0ba,0.7,0.5));
  front.position.z = 0.14; g.add(front);
  g.add(box(1.0,0.6,0.03,flexMat(),0,3.5,0));
  g.add(box(0.8,0.3,0.1,darkPlastic(),0,3.85,0.03));
  return g;
}
function buildChargeConnFlex(){
  const g = new THREE.Group();
  g.add(box(0.5,5.0,0.03,flexMat()));
  g.add(box(0.9,0.5,0.1,darkPlastic(),0,-2.5,0.04));
  g.add(box(0.9,0.5,0.1,darkPlastic(),0,2.5,0.04));
  return g;
}
function buildLoudspeaker(){
  const g = new THREE.Group();
  g.add(box(1.7,1.3,0.45,M(0xaeb4be,0.85,0.35)));
  g.add(box(1.4,1.0,0.02,M(0x0b0c10,0.2,0.8),0,0,0.23));
  for(let i=-2;i<=2;i++) g.add(box(0.05,0.8,0.01,steel(),i*0.25,0,0.25));
  g.add(box(0.4,0.2,0.1,M(0xd9b24a,0.9,0.3),0.6,-0.7,0));
  return g;
}
function buildRinger(){
  const g = new THREE.Group();
  g.add(box(2.4,1.35,0.5,darkPlastic()));
  for(let r=0;r<2;r++) for(let i=0;i<6;i++) g.add(cyl(0.07,0.02,M(0x000000),-0.9+i*0.36,-0.22+r*0.44,0.26));
  g.add(box(2.0,0.08,0.52,M(0x30343c,0.3,0.5),0,0.45,0));
  return g;
}
function buildChargeFlex(){
  const g = new THREE.Group();
  g.add(box(4.6,1.3,0.03,flexMat()));
  g.add(box(1.05,0.55,0.3,steel(),0,-0.45,0.17));
  g.add(box(0.8,0.3,0.32,M(0x000000),0,-0.5,0.17));
  g.add(cyl(0.08,0.04,M(0x111111),-1.4,-0.4,0.04));
  g.add(cyl(0.08,0.04,M(0x111111),1.4,-0.4,0.04));
  g.add(box(1.0,0.4,0.1,darkPlastic(),-1.6,0.35,0.05));
  g.add(box(0.9,0.4,0.1,M(0x2a2d35,0.2,0.6),1.5,0.3,0.05));
  return g;
}
function buildBack(){
  const g = new THREE.Group();
  const col = 0x2c3b5c;
  g.add(ext(rrPath(new THREE.Shape(),6.8,14.4,0.95), 0.06, M(col,0.35,0.16)));
  const plate = ext(rrPath(new THREE.Shape(),3.5,3.5,0.75), 0.07, M(0x3a4c73,0.4,0.15));
  plate.position.set(-1.4,5.0,-0.1); g.add(plate);
  const ring = M(0x9aa7c2,1,0.3), glass = M(0x050608,0.9,0.08);
  [[-2.2,5.8],[-2.2,4.2],[-0.6,5.0]].forEach(([x,y])=>{
    g.add(cyl(0.68,0.1,ring,x,y,-0.2));
    g.add(cyl(0.5,0.12,glass,x,y,-0.22));
    g.add(cyl(0.18,0.13,M(0x2b3a6b,1,0.05),x,y,-0.23));
  });
  g.add(cyl(0.16,0.06,M(0xfff3c2,0.1,0.3),-0.4,6.1,-0.16));
  g.add(cyl(0.1,0.06,M(0x15171c,0.2,0.3),-0.4,4.0,-0.16));
  // شعار دائري بسيط
  g.add(cyl(0.45,0.02,M(0x4a5d88,0.5,0.2),0,-0.5,-0.06));
  return g;
}

/* ============ تعريف القطع ============ */
const DEFS = [
  { id:'screen',    name:'شاشة',            build:buildScreen,     base:[0,0,0.45],       ex:[0,0.6,7.2],
    desc:'شاشة OLED بزجاج واقي ولمس. أول قطعة بتتفك، وفيها الجزيرة الديناميكية وحساسات Face ID والكاميرا الأمامية.' },
  { id:'screenFlex',name:'فلاتة ربط شاشة',  build:buildScreenFlex, base:[0,-6.0,0.3],     ex:[0,-0.6,5.9],
    desc:'كابل فلات بيوصل الشاشة والتاتش بالبوردة. بيتفك بالمقدّم قبل ما ترفع الشاشة تماماً عشان ما يتقطعش.' },
  { id:'earpiece',  name:'سماعة داخلية',    build:buildEarpiece,   base:[0,6.75,0.22],    ex:[0,1.2,4.8],
    desc:'سماعة المكالمات اللي في أعلى الشاشة. بتشتغل كمان مع السماعة السفلية في الستيريو.' },
  { id:'frame',     name:'فريم',            build:buildFrame,      base:[0,0,0],          ex:[0,0,3.4],
    desc:'الإطار الخارجي المعدني اللي بيمسك كل القطع، وعليه أزرار الصوت والباور والأكشن وزر الكاميرا.' },
  { id:'powerFlex', name:'فلاتة باور',      build:buildPowerFlex,  base:[3.15,2.6,-0.2],  ex:[3.0,0.8,2.2],
    desc:'فلاتة زر التشغيل (الباور) بتوصل الضغطة للبوردة. غالباً بتتفك مع فلاتة الصوت حسب الموديل.' },
  { id:'middle',    name:'ميدل',            build:buildMiddle,     base:[0,0,-0.1],       ex:[0,0,1.8],
    desc:'الهيكل الداخلي (الشاسيه) اللي بيتركب عليه البوردة والبطارية، وفيه فتحة مخصوصة للبطارية.' },
  { id:'socket',    name:'سوكيت',           build:buildSocket,     base:[-3.1,-0.8,-0.1], ex:[-3.5,0,1.0],
    desc:'سوكيت الشريحة (SIM) اللي بيدخل فيه الدرج، موجود على الجنب الشمال من الفريم.' },
  { id:'battery',   name:'بطارية',          build:buildBattery,    base:[0,-1.5,-0.12],   ex:[0,0,0.3],
    desc:'بطارية ليثيوم أيون مثبتة بشرائط لاصقة. اتأكد دايماً من فصل الكونيكتور قبل أي شغل جواه.' },
  { id:'chargeConn',name:'فلاتة ربط شحن',   build:buildChargeConnFlex, base:[-2.75,-3.2,-0.28], ex:[-2.6,0,-1.4],
    desc:'كابل بيربط فلاتة الشحن السفلية بالبوردة الأساسية وبينقل الشحن والداتا والميكروفونات.' },
  { id:'speaker',   name:'سماعة خارجية',    build:buildLoudspeaker,base:[2.4,-6.4,-0.12], ex:[2.2,-1.5,-2.4],
    desc:'السماعة السفلية (اللاود سبيكر) المسؤولة عن الرنين والمكالمات على السبيكر والميديا.' },
  { id:'ringer',    name:'علبة جرس',        build:buildRinger,     base:[-2.3,-6.4,-0.12],ex:[-1.8,-1.8,-3.4],
    desc:'علبة الجرس (بيت السماعة الخارجية) بالشبك والفتحات اللي بتخرّج الصوت من أسفل الجهاز.' },
  { id:'chargeFlex',name:'فلاتة شحن',       build:buildChargeFlex, base:[0,-6.8,-0.3],    ex:[0,-2.2,-4.6],
    desc:'فلاتة الشحن بمنفذ USB-C والميكروفونات السفلية. أكتر قطعة بتتغير في الصيانة.' },
  { id:'back',      name:'ضهرية',           build:buildBack,       base:[0,0,-0.45],      ex:[0,0,-7.2],
    desc:'الظهر الزجاجي مع نتوء الكاميرا الخلفية والفلاش، وبيدعم الشحن اللاسلكي.' },
];

const parts = {};
DEFS.forEach(d=>{
  const g = d.build();
  g.position.set(...d.base);
  const mats = [];
  g.traverse(o=>{
    if(o.isMesh){
      o.material = o.material.clone();
      o.userData.partId = d.id;
      o.material.userData.t = 1;
      mats.push(o.material);
    }
  });
  phone.add(g);
  parts[d.id] = { ...d, group:g, mats, opacity:1, target:1, glow:false };
});

/* ============ واجهة المستخدم ============ */
const listEl = document.getElementById('list');
const infoEl = document.getElementById('info');
const labelsEl = document.getElementById('labels');
const exEl = document.getElementById('ex');
let selected = null, hovered = null, showTags = false, auto = false;

DEFS.forEach((d,i)=>{
  const b = document.createElement('button');
  b.className='item'; b.dataset.id=d.id;
  b.innerHTML = `<span class="n">${i+1}</span><span>${d.name}</span>`;
  b.onclick = ()=> select(selected===d.id ? null : d.id);
  b.onmouseenter = ()=> hovered = d.id;
  b.onmouseleave = ()=> hovered = null;
  listEl.appendChild(b);
  const t = document.createElement('div'); t.className='tag'; t.textContent=d.name; t.id='tag-'+d.id;
  labelsEl.appendChild(t);
});

function select(id){
  selected = id;
  document.querySelectorAll('.item').forEach(e=>e.classList.toggle('active', e.dataset.id===id));
  if(id){
    infoEl.style.display='block';
    infoEl.querySelector('h2').textContent = parts[id].name;
    infoEl.querySelector('p').textContent = parts[id].desc;
    if(exEl.value < 0.5){ exEl.value = 1; }
  } else infoEl.style.display='none';
}

const bAuto = document.getElementById('bAuto');
const bSpin = document.getElementById('bSpin');
const bTags = document.getElementById('bTags');
bAuto.onclick = ()=>{ auto=!auto; bAuto.classList.toggle('on',auto); };
bSpin.onclick = ()=>{ controls.autoRotate=!controls.autoRotate; bSpin.classList.toggle('on',controls.autoRotate); };
bTags.onclick = ()=>{ showTags=!showTags; bTags.classList.toggle('on',showTags);
  document.querySelectorAll('.tag').forEach(t=>t.style.display = showTags?'block':'none'); };
document.getElementById('bReset').onclick = ()=>{
  select(null); auto=false; bAuto.classList.remove('on');
  controls.autoRotate=false; bSpin.classList.remove('on');
  exEl.value = 1; placeCamera();
};

/* ============ اختيار القطع بالماوس/اللمس ============ */
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
const allMeshes = []; phone.traverse(o=>{ if(o.isMesh) allMeshes.push(o); });
function pick(e){
  const r = canvas.getBoundingClientRect();
  ptr.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(allMeshes, false).find(h=>{
    const p = parts[h.object.userData.partId];
    return !selected || p.id===selected || true;
  });
  return hit ? hit.object.userData.partId : null;
}
let down = null;
canvas.addEventListener('pointerdown', e=> down = {x:e.clientX,y:e.clientY});
canvas.addEventListener('pointerup', e=>{
  if(!down) return;
  const moved = Math.hypot(e.clientX-down.x, e.clientY-down.y) > 6; down = null;
  if(moved) return;
  const id = pick(e);
  select(id && id!==selected ? id : null);
});
canvas.addEventListener('pointermove', e=>{
  if(e.pointerType==='touch' || down) return;
  hovered = pick(e);
  canvas.style.cursor = hovered ? 'pointer' : 'grab';
});

/* ============ الكاميرا والحجم ============ */
function placeCamera(){
  const a = innerWidth/innerHeight;
  const k = a < 0.8 ? 1.55 : a < 1.2 ? 1.2 : 1;
  camera.position.set(17*k, 8.5*k, 29*k);
  controls.target.set(0,0,0);
  controls.update();
}
function resize(){
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize(); placeCamera();

/* ============ حلقة الرسم ============ */
let explode = 0;
exEl.value = 0;
let intro = performance.now();
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  // مقدمة: فك تلقائي عند فتح الصفحة
  if(performance.now() - intro > 700 && intro){ exEl.value = 1; intro = 0; }

  if(auto) exEl.value = 0.5 - 0.5*Math.cos(t*0.9);
  explode += (parseFloat(exEl.value) - explode) * 0.08;

  const active = selected || null;
  for(const id in parts){
    const p = parts[id];
    p.group.position.set(
      p.base[0] + p.ex[0]*explode,
      p.base[1] + p.ex[1]*explode,
      p.base[2] + p.ex[2]*explode
    );
    p.target = (active && id!==active) ? 0.14 : 1;
    p.opacity += (p.target - p.opacity) * 0.15;
    const glow = (id===active) || (id===hovered);
    p.mats.forEach(m=>{
      const tr = p.opacity < 0.995;
      if(m.transparent !== tr){ m.transparent = tr; m.depthWrite = !tr; m.needsUpdate = true; }
      m.opacity = p.opacity;
      if(m.emissive) m.emissive.setHex(glow ? 0x1b3f8a : 0x000000);
    });
  }

  controls.update();
  renderer.render(scene, camera);

  // أسماء القطع
  const hl = hovered || selected;
  for(const id in parts){
    const el = document.getElementById('tag-'+id);
    const visible = showTags || id===hl;
    el.style.display = visible ? 'block':'none';
    if(!visible) continue;
    parts[id].group.getWorldPosition(tmp);
    tmp.project(camera);
    el.style.left = ((tmp.x*0.5+0.5)*innerWidth)+'px';
    el.style.top  = ((-tmp.y*0.5+0.5)*innerHeight)+'px';
    el.classList.toggle('hl', id===hl);
    el.style.opacity = (selected && id!==selected && !showTags) ? 0 : 1;
  }
}
animate();
setTimeout(()=>{ const l=document.getElementById('loading'); l.style.opacity=0; setTimeout(()=>l.remove(),700); }, 400);
</script>
