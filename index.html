<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">

<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-2 sm:p-4 flex items-center justify-center relative overflow-x-hidden">

    <!-- القائمة الجانبية (Sidebar) المخفية افتراضياً -->

    <!-- البطاقة البيضاء الرئيسية - ملء الشاشة (Full Screen Card) -->

        <!-- حاوية الشاشات الديناميكية -->
        <div id="appContainer" class="flex-1 flex flex-col overflow-hidden"></div>

    </div>

    <!-- كود الجافاسكريبت لإدارة النظام والصفحات والـ RPC المحددة فقط -->
    <script>
        // ================= 1. المتغيرات وإعدادات الاتصال =================
        const SUPABASE_URL = 'https://glwwvrgvbfygqbmqlnfn.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_bCXPU0JSPeF-tG4OkHSXsQ_wyyRyC0w';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUserId = null;
        let currentUserRole = "";
        let currentUserName = "";
        let currentUserPhone = "";

        let selectedBrand = "";
        let selectedModel = "";
        let selectedPart = "";
        let selectedModelCode = ""; 
        let currentScreenCompatibility = "";
        let currentBatteryModel = "";
        let heartbeatInterval = null;

        // ================= الثوابت والدوال المساعدة للمحافظات والمناطق =================
        const EGYPTIAN_GOVERNORATES = [
            "أسوان", "الأقصر", "قنا", "البحر الأحمر", "الوادي الجديد", "سوهاج", "أسيوط", 
            "المنيا", "بني سويف", "الجيزة", "القاهرة", "سيناء", "بورسعيد", "كفر الشيخ", 
            "دمياط", "الدقهلية", "الشرقية", "الغربية", "المنوفية", "الفيوم", "بحيرة", 
            "الإسكندرية", "مطروح"
        ];

        function getGovernoratesOptionsHtml(selectedValue = "") {
            return `<option value="">اختر المحافظة...</option>` + 
                EGYPTIAN_GOVERNORATES.map(gov => 
                    `<option value="${gov}" ${gov === selectedValue ? 'selected' : ''}>${gov}</option>`
                ).join('');
        }

        function getRegionsListForCity(city) {
            if (city === 'أسوان') {
                return ['إدفو', 'كوم أمبو', 'دراو', 'مركز أسوان'];
            } else if (city) {
                return [`${city} - عام`];
            }
            return [];
        }

        function getAreasListForRegion(region) {
            if (region === 'مركز أسوان') {
                return ['السيل', 'الطابية', 'النفق', 'التأمين'];
            } else if (region) {
                return ['عام'];
            }
            return [];
        }

        function updateRegionsDropdown(cityId, regionId, areaId) {
            const cityVal = document.getElementById(cityId)?.value;
            const regionSelect = document.getElementById(regionId);
            const areaSelect = document.getElementById(areaId);

            if (!regionSelect) return;

            const regions = getRegionsListForCity(cityVal);
            regionSelect.innerHTML = '<option value="">اختر المنطقة...</option>' + 
                regions.map(r => `<option value="${r}">${r}</option>`).join('');

            if (areaSelect) {
                areaSelect.innerHTML = '<option value="">اختر النطاق أولاً...</option>';
            }
        }

        function updateAreasDropdown(regionId, areaId) {
            const regionVal = document.getElementById(regionId)?.value;
            const areaSelect = document.getElementById(areaId);

            if (!areaSelect) return;

            const areas = getAreasListForRegion(regionVal);
            areaSelect.innerHTML = '<option value="">اختر النطاق...</option>' + 
                areas.map(a => `<option value="${a}">${a}</option>`).join('');
        }

        // ================= دالة تبديل رؤية كلمة المرور (العين) =================
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (!input || !icon) return;

            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />`;
            } else {
                input.type = 'password';
                icon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />`;
            }
        }

        // ================= نظام الهيرت بيت (Heartbeat) =================
        function startHeartbeat() {
            if (heartbeatInterval) clearInterval(heartbeatInterval);

            heartbeatInterval = setInterval(async () => {
                if (!currentUserId) return;

                try {
                    await supabaseClient.rpc('update_last_active_at', {
                        target_user_id: currentUserId
                    });
                } catch (err) {
                    console.error("Heartbeat error:", err);
                }
            }, 10000);
        }

        // ================= دالة عرض شاشة المستخدمين الجدد (آخر 24 ساعة) =================
        async function renderNewUsersScreen() {
            toggleSidebar();

            const container = document.getElementById('appContainer');
            container.innerHTML = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0 flex-wrap gap-2">
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5 cursor-pointer">
                            <svg class="w-4 h-4 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            <span>رجوع</span>
                        </button>
                        <button type="button" onclick="fetchAndDisplayNewUsers();" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5 border border-blue-200 cursor-pointer" title="تحديث البيانات">
                            <svg class="w-4 h-4 transform transition-transform hover:rotate-180 duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            <span>تحديث</span>
                        </button>
                    </div>
                    <h2 id="newUsersTitle" class="text-sm sm:text-base font-bold text-gray-800 flex items-center gap-2">
                        <span class="w-3 h-3 bg-blue-500 rounded-full animate-pulse"></span>
                        المستخدمون الجدد (آخر ٢٤ ساعة)
                    </h2>
                </div>

                <div id="newUsersTableContainer" class="flex-1 overflow-y-auto p-1">
                    <div class="text-center text-gray-400 text-sm py-8">جاري جلب المستخدمين الجدد...</div>
                </div>
            `;

            loadDynamicMenuIntoSidebar();
            await fetchAndDisplayNewUsers();
        }

        // ================= دالة جلب وعرض بيانات المستخدمين الجدد =================
        async function fetchAndDisplayNewUsers() {
            const tableContainer = document.getElementById('newUsersTableContainer');
            const titleElement = document.getElementById('newUsersTitle');

            if (tableContainer) {
                tableContainer.innerHTML = `<div class="text-center text-gray-400 text-sm py-8">جاري تحديث البيانات...</div>`;
            }

            try {
                const { data, error } = await supabaseClient.rpc('get_new_users_last_24h', {
                    p_user_id: currentUserId
                });

                if (error) {
                    if (tableContainer) tableContainer.innerHTML = `<div class="text-center text-red-400 text-sm py-8">خطأ في جلب البيانات: ${error.message}</div>`;
                    return;
                }

                if (data && data.success === false) {
                    if (tableContainer) tableContainer.innerHTML = `<div class="text-center text-red-500 text-sm py-8 font-semibold">${data.message || 'عفواً، لا تملك الصلاحية'}</div>`;
                    return;
                }

                let newUsersList = [];
                if (Array.isArray(data)) {
                    newUsersList = data;
                } else if (typeof data === 'string') {
                    try { newUsersList = JSON.parse(data); } catch(e){}
                }

                if (titleElement) {
                    titleElement.innerHTML = `
                        <span class="w-3 h-3 bg-blue-500 rounded-full animate-pulse"></span>
                        المستخدمون الجدد (آخر ٢٤ ساعة) (${newUsersList.length})
                    `;
                }

                if (newUsersList.length > 0) {
                    if (tableContainer) {
                        tableContainer.innerHTML = `
                            <div class="overflow-x-auto rounded-2xl border border-gray-200 shadow-sm">
                                <table class="w-full text-right text-xs sm:text-sm whitespace-nowrap">
                                    <thead class="bg-gray-50 text-gray-700 border-b border-gray-200">
                                        <tr>
                                            <th class="p-3.5 font-bold whitespace-nowrap min-w-[130px]">تاريخ الإنشاء</th>
                                            <th class="p-3.5 font-bold">الرتبة</th>
                                            <th class="p-3.5 font-bold">الاسم</th>
                                            <th class="p-3.5 font-bold">اسم المتجر</th>
                                            <th class="p-3.5 font-bold">محافظة المتجر</th>
                                            <th class="p-3.5 font-bold">منطقة المتجر</th>
                                            <th class="p-3.5 font-bold">نطاق المتجر</th>
                                            <th class="p-3.5 font-bold">عنوان المتجر</th>
                                            <th class="p-3.5 font-bold">اسم المحل</th>
                                            <th class="p-3.5 font-bold">محافظة المحل</th>
                                            <th class="p-3.5 font-bold">منطقة المحل</th>
                                            <th class="p-3.5 font-bold">نطاق المحل</th>
                                            <th class="p-3.5 font-bold">عنوان المحل</th>
                                            <th class="p-3.5 font-bold">محافظة التوصيل</th>
                                            <th class="p-3.5 font-bold">منطقة التوصيل</th>
                                            <th class="p-3.5 font-bold">نطاق التوصيل</th>
                                            <th class="p-3.5 font-bold">رقم الهاتف</th>
                                            <th class="p-3.5 font-bold">رقم الواتساب</th>
                                            <th class="p-3.5 font-bold">البريد الإلكترونى</th>
                                            <th class="p-3.5 font-bold">رمز المرور</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100 bg-white">
                                        ${newUsersList.map(user => {
                                            let rawTime = user.created_at || '';
                                            let datePart = '---';
                                            let timePart = '';

                                            if (rawTime && rawTime.includes('T')) {
                                                const parts = rawTime.split('T');
                                                datePart = parts[0];
                                                timePart = parts[1] ? parts[1].split('.')[0] : '';
                                            } else if (rawTime && rawTime.includes(' ')) {
                                                const parts = rawTime.split(' ');
                                                datePart = parts[0];
                                                timePart = parts[1] || '';
                                            } else {
                                                datePart = rawTime || '---';
                                            }

                                            return `
                                                <tr class="hover:bg-blue-50/50 transition-all">
                                                    <td class="p-3.5 font-mono text-gray-700 leading-tight min-w-[130px]" dir="ltr">
                                                        <div class="font-bold text-gray-800">${datePart}</div>${timePart ? `<div class="text-[11px] text-gray-500 mt-0.5">${timePart}</div>` : ''}
                                                    </td>
                                                    <td class="p-3.5 font-bold text-blue-600" dir="auto">${user.user_role || '---'}</td>
                                                    <td class="p-3.5 font-semibold text-gray-800" dir="auto">${user.user_name || '---'}</td>
                                                    <td class="p-3.5 text-gray-700" dir="auto">${user.store_name || '---'}</td>
                                                    <td class="p-3.5 text-gray-700" dir="auto">${user.store_city || '---'}</td>
                                                    <td class="p-3.5 text-gray-700" dir="auto">${user.store_region || '---'}</td>
                                                    <td class="p-3.5 text-gray-700" dir="auto">${user.store_area || '---'}</td>
                                                    <td class="p-3.5 text-gray-700" dir="auto">${user.store_address || '---'}</td>
                                                    <td class="p-3.5 text-gray-700" dir="auto">${user.shop_name || '---'}</td>
                                                    <td class="p-3.5 text-gray-700" dir="auto">${user.shop_city || '---'}</td>
                                                    <td class="p-3.5 text-gray-700" dir="auto">${user.shop_region || '---'}</td>
                                                    <td class="p-3.5 text-gray-700" dir="auto">${user.shop_area || '---'}</td>
                                                    <td class="p-3.5 text-gray-700" dir="auto">${user.shop_address || '---'}</td>
                                                    <td class="p-3.5 text-gray-700" dir="auto">${user.delivery_city || '---'}</td>
                                                    <td class="p-3.5 text-gray-700" dir="auto">${user.delivery_region || '---'}</td>
                                                    <td class="p-3.5 text-gray-700" dir="auto">${user.delivery_area || '---'}</td>
                                                    <td class="p-3.5 font-mono text-gray-600" dir="ltr">${user.phone_number || '---'}</td>
                                                    <td class="p-3.5 font-mono text-gray-600" dir="ltr">${user.whatsapp_number || '---'}</td>
                                                    <td class="p-3.5 font-mono text-gray-600" dir="ltr">${user.gmail || '---'}</td>
                                                    <td class="p-3.5 font-mono text-gray-600" dir="ltr">${user.password || '---'}</td>
                                                </tr>
                                            `;
                                        }).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `;
                    }
                } else {
                    if (tableContainer) {
                        tableContainer.innerHTML = `<div class="text-center text-gray-500 py-12 bg-gray-50 rounded-2xl border border-gray-200"><p class="font-semibold">لا توجد حسابات مسجلة في آخر ٢٤ ساعة</p></div>`;
                    }
                }

            } catch (err) {
                console.error(err);
                if (tableContainer) tableContainer.innerHTML = `<div class="text-center text-red-400 text-sm py-8">حدث خطأ غير متوقع</div>`;
            }
        }

        // ================= دالة عرض شاشة بيانات المستخدمين =================
        async function renderUserProfilesScreen() {
            toggleSidebar();

            const container = document.getElementById('appContainer');
            container.innerHTML = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-3 flex-shrink-0 flex-wrap gap-2">
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5 cursor-pointer">
                            <svg class="w-4 h-4 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            <span>رجوع</span>
                        </button>
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="fetchAndDisplayUserProfiles();" class="bg-blue-50 hover:bg-blue-100 text-blue-600 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5 border border-blue-200 cursor-pointer" title="تحديث البيانات">
                            <svg class="w-4 h-4 transform transition-transform hover:rotate-180 duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            <span>تحديث</span>
                        </button>
                        <button type="button" onclick="openFilterModal()" class="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5 shadow-sm cursor-pointer">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"></path></svg>
                            <span>فلترة البيانات</span>
                        </button>
                        <button type="button" onclick="resetUserFilters()" id="resetFilterBtn" class="hidden bg-gray-200 hover:bg-gray-300 text-gray-700 px-3 py-2 rounded-xl text-xs font-semibold transition-all cursor-pointer">
                            إلغاء الفلتر
                        </button>
                    </div>
                </div>

                <div id="activeFilterBadge" class="hidden bg-blue-50 border border-blue-200 text-blue-700 px-3 py-1.5 rounded-xl text-xs font-semibold mb-3 flex items-center justify-between flex-shrink-0">
                    <span id="activeFilterText">---</span>
                </div>

                <h2 class="text-sm sm:text-base font-bold text-gray-800 mb-2">بيانات المستخدمين</h2>

                <div id="userProfilesTableContainer" class="flex-1 overflow-y-auto p-1">
                    <div class="text-center text-gray-400 text-sm py-8">جاري جلب بيانات المستخدمين...</div>
                </div>

                <div id="filterModalOverlay" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4 transition-opacity opacity-0 duration-300">
                    <div class="bg-white w-full max-w-sm rounded-3xl shadow-2xl p-6 space-y-4 transform scale-95 transition-transform duration-300" id="filterModalContent">
                        <div class="flex items-center justify-between border-b border-gray-100 pb-3">
                            <h3 class="font-bold text-gray-800 text-base" id="filterModalTitle">اختر نوع الفلترة</h3>
                            <button onclick="closeFilterModal()" class="text-gray-400 hover:text-red-500 p-1 rounded-xl">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>

                </div>

            loadDynamicMenuIntoSidebar();
            window.allUserProfilesCache = [];

        // ================= دالة جلب وعرض بيانات المستخدمين =================
        async function fetchAndDisplayUserProfiles() {
            const tableContainer = document.getElementById('userProfilesTableContainer');
            if (!tableContainer) return;

            tableContainer.innerHTML = `<div class="text-center text-gray-400 text-sm py-8">جاري تحديث البيانات...</div>`;

            try {
                const { data, error } = await supabaseClient.rpc('get_user_profiles', {
                    p_user_id: currentUserId
                });

                if (error) {
                    tableContainer.innerHTML = `<div class="text-center text-red-400 text-sm py-8">خطأ في جلب البيانات: ${error.message}</div>`;
                    return;
                }

                let profilesList = [];
                if (Array.isArray(data)) {
                    profilesList = data;
                } else if (typeof data === 'string') {
                    try { profilesList = JSON.parse(data); } catch(e){}
                }

                window.allUserProfilesCache = profilesList;
                renderProfilesTableHTML(profilesList);

            } catch (err) {
                console.error(err);
                tableContainer.innerHTML = `<div class="text-center text-red-400 text-sm py-8">حدث خطأ غير متوقع</div>`;
            }
        }

        function openFilterModal() {
            const overlay = document.getElementById('filterModalOverlay');
            const content = document.getElementById('filterModalContent');
            if (!overlay || !content) return;

            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);

            showMainFilterOptions();
        }

        function closeFilterModal() {
            const overlay = document.getElementById('filterModalOverlay');
            const content = document.getElementById('filterModalContent');
            if (!overlay || !content) return;

            overlay.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => overlay.classList.add('hidden'), 300);
        }

        function showMainFilterOptions() {

        async function handleDeletePersonalProfile() {
            if (!currentUserId) {
                alert("عفواً، لا يوجد مستخدم مسجل حالياً");
                return;
            }

            const confirmDelete = confirm("هل أنت متأكد من رغبتك في حذف حسابك نهائياً؟ هذا الإجراء لا يمكن التراجع عنه.");
            if (!confirmDelete) return;

            try {
                const { data, error } = await supabaseClient.rpc('delete_personal_profile', {
                    p_user_id: currentUserId
                });

                if (error) {
                    alert("خطأ أثناء حذف الحساب: " + error.message);
                    return;
                }

                if (data && data.success) {
                    alert(data.message || "تم حذف المستخدم بنجاح");
                    loginAsVisitor();
                } else {
                    alert(data?.message || "فشل العثور على المستخدم للحذف");
                }
            } catch (err) {
                console.error("Delete personal profile error:", err);
                alert("حدث خطأ غير متوقع أثناء عملية الحذف");
            }
        }

        async function handleSavePersonalProfile(e) {
            e.preventDefault();

            const getVal = (id) => {
                const el = document.getElementById(`edit_${id}`);
                return el ? el.value.trim() : null;
            };

            try {
                const { data, error } = await supabaseClient.rpc('update_personal_profile', {
                    p_user_id: currentUserId,
                    p_user_name: getVal('user_name'),
                    p_store_name: getVal('store_name'),

                    p_delivery_city: getVal('delivery_city'),
                    p_delivery_region: getVal('delivery_region'),
                    p_delivery_area: getVal('delivery_area'),
                    p_phone_number: getVal('phone_number'),
                    p_whatsapp_number: getVal('whatsapp_number'),
                    p_gmail: getVal('gmail'),
                    p_password: getVal('password')
                });

                if (error) {
                    alert("خطأ أثناء حفظ التغييرات: " + error.message);
                    return;
                }

                if (data && data.success) {
                    alert(data.message || "تم تحديث البيانات بنجاح");
                    if (getVal('user_name')) currentUserName = getVal('user_name');
                    if (getVal('phone_number')) currentUserPhone = getVal('phone_number');

                } else {
                    alert(data?.message || "تعذر حفظ البيانات");
                }
            } catch (err) {
                console.error("Save profile error:", err);
                alert("حدث خطأ غير متوقع أثناء الحفظ");
            }
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const rememberMe = document.getElementById('rememberMe')?.checked;

            if (rememberMe) {
                localStorage.setItem('saved_phone', phone);
                localStorage.setItem('saved_password', password);
            } else {
                localStorage.removeItem('saved_phone');
                localStorage.removeItem('saved_password');
            }

            const { data, error } = await supabaseClient.rpc('login', { 
                p_phone_number: phone, 
                p_password: password 
            });

            if (error || !data || !data.id) {
                showSystemAlert("خطأ في تسجيل الدخول", phone || "غير متوفر", "فشل التحقق", error?.message || "بيانات غير صحيحة");
                return;
            }

            currentUserId = data.id; 

            try {
                const profileRes = await supabaseClient.rpc('get_personal_profile', {
                    p_user_id: currentUserId
                });
                if (profileRes.data && profileRes.data.success !== false) {
                    currentUserRole = profileRes.data.user_role || '';
                    currentUserName = profileRes.data.user_name || '';
                    currentUserPhone = profileRes.data.phone_number || '';
                }
            } catch (err) {
                console.error("Error fetching user header profile:", err);
            }

            try {
                await supabaseClient.rpc('update_last_active_at', {
                    target_user_id: currentUserId
                });
            } catch (err) {
                console.error("Instant heartbeat error:", err);
            }

            startHeartbeat();
            renderMainDashboard();
            loadDynamicMenuIntoSidebar(); 
        }

                            <div onclick="${clickAction}" class="w-full bg-blue-600 hover:bg-blue-700 text-white p-5 sm:p-6 rounded-2xl shadow-md cursor-pointer transition-all flex items-center justify-between">
                                <span class="font-bold text-lg sm:text-xl" dir="auto">${name}</span>
                                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            </div>
                        `;
                    }).join('');

                    container.innerHTML = partitionsHtml;
                } else {
                    container.innerHTML = `<div class="text-center text-gray-400 text-sm py-4">لا توجد أقسام متاحة</div>`;
                }
            } catch (err) {
                showSystemAlert("استثناء غير متوقع", currentUserId || "غير معروف", "تنفيذ JavaScript", err.message);
            }
        }

        async function renderBrandsScreen() {
            let brands = [];
            const { data, error } = await supabaseClient.from('brands').select('*');
            
            if (!error && data) {
                brands = data.map(item => item.brand_name || item.name || Object.values(item)[1]); 
            } else if (error) {
                showSystemAlert("فشل جلب الماركات", currentUserId || "غير معروف", "جدول brands", error.message);
            }

            let brandsHtml = "";
            if (brands.length > 0) {
                brandsHtml = brands.map((brand, index) => {
                    const style = getRotatingCardStyle(index);
                    return `
                        <div onclick="renderModelsScreen('${brand}')" class="w-full ${style.bg} border ${style.border} p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm sm:text-base group">
                            <span class="font-bold text-gray-800" dir="auto">${brand}</span>
                            <svg class="w-5 h-5 ${style.icon} flex-shrink-0 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </div>
                    `;
                }).join('');
            } else {
                brandsHtml = `<div class="text-center text-gray-500 py-6">لا توجد ماركات متاحة حالياً</div>`;
            }

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5">
                        <svg class="w-4 h-4 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        <span>رجوع</span>
                    </button>
                    <h2 class="text-sm sm:text-base font-bold text-gray-800">اختر الماركة</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 p-1">
                    ${brandsHtml}
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
            loadDynamicMenuIntoSidebar();
        }

        async function renderModelsScreen(brand) {
            selectedBrand = brand;
            let tableName = "";
            let nameColumn = "device_name";
            let codeColumn = "model_code";
            let compatColumn = "screen_compatibility";
            let batteryColumn = "battery_model";
            
            const b = brand.toLowerCase();
            if (b.includes('samsung')) {
                tableName = 'samsung_models'; nameColumn = 'samsung_phone_name'; codeColumn = 'samsung_phone_code'; compatColumn = 'samsung_screen_compatibility'; batteryColumn = 'samsung_battery_model';
            } else if (b.includes('iphone') || b.includes('apple')) {
                tableName = 'apple_models'; nameColumn = 'apple_phone_name'; codeColumn = 'apple_phone_code'; compatColumn = 'apple_screen_compatibility'; batteryColumn = 'apple_battery_model';
            } else if (b.includes('xiaomi') || b.includes('poco')) {
                tableName = 'xiaomi_models'; nameColumn = 'xiaomi_phone_name'; codeColumn = 'xiaomi_phone_code'; compatColumn = 'xiaomi_screen_compatibility'; batteryColumn = 'xiaomi_battery_model';
            } else if (b.includes('redmi')) {
                tableName = 'redmi_models'; nameColumn = 'redmi_phone_name'; codeColumn = 'redmi_phone_code'; compatColumn = 'redmi_screen_compatibility'; batteryColumn = 'redmi_battery_model';
            } else if (b.includes('huawei')) {
                tableName = 'huawei_models'; nameColumn = 'huawei_phone_name'; codeColumn = 'huawei_phone_code'; compatColumn = 'huawei_screen_compatibility'; batteryColumn = 'huawei_battery_model';
            } else if (b.includes('honor')) {
                tableName = 'honor_models'; nameColumn = 'honor_phone_name'; codeColumn = 'honor_phone_code'; compatColumn = 'honor_screen_compatibility'; batteryColumn = 'honor_battery_model';
            } else if (b.includes('oppo')) {
                tableName = 'oppo_models'; nameColumn = 'oppo_phone_name'; codeColumn = 'oppo_phone_code'; compatColumn = 'oppo_screen_compatibility'; batteryColumn = 'oppo_battery_model';
            } else if (b.includes('realme')) {
                tableName = 'realme_models'; nameColumn = 'realme_phone_name'; compatColumn = 'realme_screen_compatibility'; batteryColumn = 'realme_battery_model';
            } else if (b.includes('itel')) {
                tableName = 'itel_models'; nameColumn = 'itel_phone_name'; codeColumn = 'itel_phone_code'; compatColumn = 'itel_screen_compatibility'; batteryColumn = 'itel_battery_model';
            } else if (b.includes('nokia')) {
                tableName = 'nokia_models'; nameColumn = 'nokia_phone_name'; codeColumn = 'nokia_phone_code'; compatColumn = 'nokia_screen_compatibility'; batteryColumn = 'nokia_battery_model';
            } else if (b.includes('vivo')) {
                tableName = 'vivo_models'; nameColumn = 'vivo_phone_name'; codeColumn = 'vivo_phone_code'; compatColumn = 'vivo_screen_compatibility'; batteryColumn = 'vivo_battery_model';
            } else if (b.includes('techno') || b.includes('tecno')) {
                tableName = 'tecno_models'; nameColumn = 'tecno_phone_name'; codeColumn = 'tecno_phone_code'; compatColumn = 'tecno_screen_compatibility'; batteryColumn = 'tecno_battery_model';
            } else if (b.includes('infinix')) {
                tableName = 'infinix_models'; nameColumn = 'infinix_phone_name'; codeColumn = 'infinix_phone_code'; compatColumn = 'infinix_screen_compatibility'; batteryColumn = 'infinix_battery_model';
            }

            let models = [];
            if (tableName) {
                const { data, error } = await supabaseClient.from(tableName).select('*').order('id', { ascending: true });
                if (!error && data) {
                    models = data.map(item => ({
                        device_name: item[nameColumn] || item['device_name'],
                        model_code: item[codeColumn] || item['model_code'],
                        screen_compatibility: item[compatColumn] || item['screen_compatibility'] || null,
                        battery_model: item[batteryColumn] || item['battery_model'] || null
                    }));
                }
            }

            let modelsHtml = "";
            if (models.length > 0) {
                modelsHtml = models.map((m, index) => {
                    const style = getRotatingCardStyle(index);
                    const escapedCompat = m.screen_compatibility ? encodeURIComponent(m.screen_compatibility) : '';
                    const escapedBattery = m.battery_model ? encodeURIComponent(m.battery_model) : '';
                    const escapedCode = m.model_code ? encodeURIComponent(m.model_code) : '';
                    return `
                        <div onclick="renderPartsScreen('${m.device_name}', '${escapedCode}', '${escapedCompat}', '${escapedBattery}')" class="w-full ${style.bg} border ${style.border} p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm sm:text-base group">
                            <div class="text-right">
                                <span class="font-bold text-gray-800 block" dir="auto">${m.device_name}</span>
                                ${m.model_code ? `<span class="text-xs text-gray-500 block mt-0.5" dir="auto">الكود: ${m.model_code}</span>` : ''}
                            </div>
                            <svg class="w-5 h-5 ${style.icon} flex-shrink-0 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </div>
                    `;
                }).join('');
            } else {
                modelsHtml = `<div class="text-center text-gray-500 py-6">لا توجد موديلات متاحة</div>`;
            }

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderBrandsScreen()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5">
                        <svg class="w-4 h-4 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        <span>رجوع</span>
                    </button>
                    <h2 class="text-sm sm:text-base font-bold text-gray-800">اختر موديل (${brand})</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 p-1">
                    ${modelsHtml}
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
            loadDynamicMenuIntoSidebar();
        }

        async function renderPartsScreen(modelName = '', modelCode = '', screenCompat = '', batteryModel = '') {
            selectedModel = modelName;
            selectedModelCode = modelCode ? decodeURIComponent(modelCode) : '';
            currentScreenCompatibility = screenCompat ? decodeURIComponent(screenCompat) : '';
            currentBatteryModel = batteryModel ? decodeURIComponent(batteryModel) : '';

            document.getElementById('appContainer').innerHTML = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5">
                        <svg class="w-4 h-4 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        <span>رجوع</span>
                    </button>
                    <h2 class="text-sm sm:text-base font-bold text-gray-800">قائمة قطع الغيار</h2>
                </div>
                <div class="flex-1 flex items-center justify-center">
                    <p class="text-gray-500 text-sm">جاري جلب قطع الغيار من قاعدة البيانات...</p>
                </div>
            `;

            let sparePartsList = [];
            try {
                const { data, error } = await supabaseClient.rpc('get_spare_parts');

                if (error) {
                    showSystemAlert("فشل جلب قطع الغيار", currentUserId || "غير معروف", "دالة get_spare_parts", error.message);
                } else if (data) {
                    sparePartsList = data;
                }
            } catch (err) {
                showSystemAlert("استثناء في جلب قطع الغيار", currentUserId || "غير معروف", "تنفيذ RPC", err.message);
            }

            let partsHtml = "";
            if (sparePartsList.length > 0) {
                partsHtml = sparePartsList.map((part, index) => {
                    const style = getRotatingCardStyle(index);
                    return `
                        <div onclick="renderPartDetails('${part}')" class="w-full ${style.bg} border ${style.border} p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm sm:text-base group">
                            <span class="font-bold text-gray-800 text-right flex-1 ml-3" dir="auto">${part}</span>
                            <svg class="w-5 h-5 ${style.icon} flex-shrink-0 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </div>
                    `;
                }).join('');
            } else {
                partsHtml = `<div class="text-center text-gray-500 py-6">لا توجد قطع غيار متاحة في الجدول حالياً</div>`;
            }

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5">
                        <svg class="w-4 h-4 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        <span>رجوع</span>
                    </button>
                    <h2 class="text-sm sm:text-base font-bold text-gray-800">قائمة قطع الغيار</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 p-1">
                    ${partsHtml}
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
            loadDynamicMenuIntoSidebar();
        }

        async function renderPartDetails(part) {
            selectedPart = part;
            alert(`تفاصيل القطعة: ${part}`);
        }

        window.onload = function() {
            renderLoginScreen();
        };
    </script>
</body>
</html>
