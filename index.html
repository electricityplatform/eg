<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity Aswan</title>
    <!-- تضمين Tailwind CSS للتنسيق -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- تضمين مكتبة Supabase للاتصال بقاعدة البيانات -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen p-2 sm:p-4 flex items-center justify-center relative overflow-x-hidden">

    <!-- القائمة الجانبية (Sidebar) المخفية افتراضياً -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-black/50 z-40 hidden transition-opacity opacity-0 duration-300"></div>
    <div id="sideMenu" class="fixed top-0 right-0 h-full w-72 bg-white shadow-2xl z-50 transform translate-x-full transition-transform duration-300 flex flex-col">
        <!-- رأس القائمة الجانبية -->
        <div class="p-4 border-b border-gray-100 flex items-center justify-between bg-gray-50">
            <h3 class="font-bold text-gray-800 text-base">القائمة الرئيسية</h3>
            <button onclick="toggleSidebar()" class="p-2 text-gray-500 hover:text-red-500 rounded-xl transition-all">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <!-- محتوى القائمة الجانبية الديناميكي -->
        <div id="sidebarContent" class="flex-1 overflow-y-auto p-4 space-y-2">
            <!-- يتم تعبئتها ديناميكياً -->
        </div>
    </div>

    <!-- البطاقة البيضاء الرئيسية - ملء الشاشة (Full Screen Card) -->
    <div class="bg-white w-full h-[96vh] sm:h-[94vh] rounded-3xl shadow-2xl p-4 sm:p-8 flex flex-col justify-between transition-all duration-300 overflow-hidden">
        
        <!-- حاوية الشاشات الديناميكية -->
        <div id="appContainer" class="flex-1 flex flex-col overflow-hidden"></div>

    </div>

    <!-- كود الجافاسكريبت لإدارة النظام والصفحات والـ RPC -->
    <script>
        // ================= 1. المتغيرات وإعدادات الاتصال =================
        const SUPABASE_URL = 'https://byiayomtcwqlgrknvgcz.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_buMxNAI5pVKhgLa_KlcHoQ_Tf_jN6Ks';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUserRole = "زائر";
        let currentUserType = "زائر";
        let currentUserId = null;
        let selectedBrand = "";
        let selectedModel = "";
        let selectedPart = "";
        let selectedModelCode = ""; 
        let currentScreenCompatibility = "";
        let currentBatteryModel = "";
        let currentUserDataGlobal = null; 

        let heartbeatInterval = null;

        function startUserHeartbeat(userId) {
            if (!userId) return;
            stopUserHeartbeat();

            sendHeartbeat(userId);

            heartbeatInterval = setInterval(() => {
                if (document.visibilityState === 'visible') {
                    sendHeartbeat(userId);
                }
            }, 10 * 1000);
        }

        async function sendHeartbeat(userId) {
            try {
                await supabaseClient.rpc('update_user_activity', {
                    target_user_id: userId
                });
            } catch (err) {
                console.error("خطأ في إرسال نبضة النشاط:", err);
            }
        }

        function stopUserHeartbeat() {
            if (heartbeatInterval) {
                clearInterval(heartbeatInterval);
                heartbeatInterval = null;
            }
        }

        window.addEventListener('beforeunload', () => {
            if (currentUserId) {
                sendHeartbeat(currentUserId);
            }
        });

        function showSystemAlert(title, idStatus, menuStatus, errorDetails = "") {
            let message = `--- 🔍 تقرير حالة النظام والتنبيهات ---\n\n`;
            message += `📌 الحدث: ${title}\n`;
            message += `🆔 حالة الـ ID: ${idStatus}\n`;
            message += `📋 حالة جلب المنيو أو البيانات: ${menuStatus}\n`;
            if (errorDetails) {
                message += `⚠ تفاصيل العطل / السبب: ${errorDetails}\n`;
            } else {
                message += `✅ الحالة العامة: سليم بدون أخطاء\n`;
            }
            alert(message);
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sideMenu');
            const overlay = document.getElementById('sidebarOverlay');
            
            if (sidebar.classList.contains('translate-x-full')) {
                sidebar.classList.remove('translate-x-full');
                overlay.classList.remove('hidden');
                setTimeout(() => overlay.classList.remove('opacity-0'), 10);
            } else {
                sidebar.classList.add('translate-x-full');
                overlay.classList.add('opacity-0');
                setTimeout(() => overlay.classList.add('hidden'), 300);
            }
        }

        function getRotatingCardStyle(index) {
            return { bg: "bg-gray-50 hover:bg-blue-50/60", border: "border-gray-200 hover:border-blue-200", text: "text-gray-800", icon: "text-gray-400 group-hover:text-blue-500" };
        }

        function getHeaderTemplate() {
            return `
                <div class="border-b border-gray-100 pb-4 mb-4 flex-shrink-0">
                    <div class="text-center mb-3">
                        <h1 class="text-2xl sm:text-3xl font-bold text-gray-800 tracking-wide">Electricity Aswan</h1>
                    </div>

                    <div class="flex items-center justify-between mb-4">
                        <button onclick="toggleSidebar()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-xs sm:text-sm rounded-xl px-4 py-2.5 flex items-center gap-2 shadow-sm transition-all cursor-pointer">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                            <span>القائمة</span>
                        </button>

                        <div class="bg-blue-50/60 border border-blue-100 px-3.5 py-2 rounded-xl text-blue-700 text-xs sm:text-sm font-semibold shadow-sm">
                            ${currentUserRole}
                        </div>
                    </div>

                    <div class="flex items-center gap-2">
                        <div class="flex-1 relative">
                            <input type="text" placeholder="ابحث" class="w-full bg-gray-50 border border-gray-200 text-gray-700 text-xs sm:text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
                        </div>
                        <button onclick="alert('جارِ الاستماع للصوت...فعل ميكروفون المتصفح')" class="bg-gray-50 hover:bg-gray-100 border border-gray-200 p-3 rounded-xl text-gray-600 transition-all shadow-sm" title="بحث صوتي">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                        </button>
                        <button onclick="alert('جارِ فتح الكاميرا للمسح الضوئي...')" class="bg-gray-50 hover:bg-gray-100 border border-gray-200 p-3 rounded-xl text-gray-600 transition-all shadow-sm" title="بحث بالكاميرا">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        </button>
                    </div>
                </div>
            `;
        }

        async function loadDynamicMenuIntoSidebar() {
            try {
                let menuItems = [];
                
                if (!currentUserId) {
                    const sidebarContainer = document.getElementById('sidebarContent');
                    if (sidebarContainer) {
                        sidebarContainer.innerHTML = `<div class="text-center text-gray-400 text-xs py-4">الرجاء تسجيل الدخول أولاً</div>`;
                    }
                    return;
                }

                const { data, error } = await supabaseClient.rpc('get_menu_items', {
                    user_id: currentUserId
                });

                if (!error && data !== null) {
                    if (Array.isArray(data)) {
                        menuItems = data;
                    } else if (typeof data === 'object') {
                        menuItems = Array.isArray(data.data) ? data.data : [data];
                    }
                }

                const sidebarContainer = document.getElementById('sidebarContent');
                if (sidebarContainer) {
                    let menuHtml = "";
                    if (menuItems && menuItems.length > 0) {
                        menuItems.forEach(item => {
                            const title = item.menu_items || item.title || "عنصر القائمة"; 
                            const action = item.action || title; 
                            menuHtml += `
                                <button onclick="toggleSidebar(); handleMenuAction('${action}', '${title}');" class="w-full text-right px-4 py-3 rounded-xl bg-gray-50 hover:bg-blue-50 text-gray-700 hover:text-blue-600 font-semibold text-sm transition-all flex items-center gap-3">
                                    <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                    <span>${title}</span>
                                </button>
                            `;
                        });
                    } else {
                        menuHtml = `<div class="text-center text-gray-400 text-xs py-4">لا توجد عناصر مضافة للقائمة</div>`;
                    }

                    sidebarContainer.innerHTML = menuHtml;
                }

            } catch (err) {
                console.error("خطأ في القائمة الجانبية:", err);
            }
        }

        function handleMenuAction(actionName, title = "") {
            const cleanAction = (actionName || "").trim();
            const cleanTitle = (title || "").trim();

            if (cleanAction.includes('البيانات الشخصية') || cleanTitle.includes('البيانات الشخصية') || cleanAction === 'renderUserProfile' || cleanAction === 'profile') {
                renderUserProfileScreen();
            } else if (cleanAction.includes('بيانات المستخدمين') || cleanTitle.includes('بيانات المستخدمين') || cleanAction === 'renderAllUsersScreen') {
                renderAllUsersScreen();
            } else if (cleanAction.includes('المستخدمون النشطون') || cleanTitle.includes('المستخدمون النشطون') || cleanAction === 'renderActiveUsersScreen') {
                renderActiveUsersScreen();
            } else if (cleanAction.includes('سجل تسجيل الدخول') || cleanTitle.includes('سجل تسجيل الدخول') || cleanAction === 'renderLoginHistoryScreen' || cleanAction.includes('سجل دخول المستخدمين')) {
                renderLoginHistoryScreen();
            } else if (typeof window[cleanAction] === 'function') {
                window[cleanAction]();
            } else {
                showSystemAlert("تنبيه عدم مطابقة وظيفة القائمة", `المُعرف الحالي: ${currentUserId || 'زائر'}`, "⚠ تنبيه وظيفة", `تم اختيار العنصر (${cleanTitle || cleanAction}) ولا توجد دالة برمجية مطابقة له بالاسم.`);
            }
        }

        async function renderActiveUsersScreen() {
            if (!currentUserId) {
                alert("يجب تسجيل الدخول أولاً!");
                return;
            }

            document.getElementById('appContainer').innerHTML = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderMainDashboard();" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        <span>رجوع</span>
                    </button>
                    
                    <div class="flex items-center gap-2">
                        <button onclick="fetchAndUpdateActiveUsers(true)" id="manualRefreshBtn" class="bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 px-3 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5 shadow-sm" title="تحديث القائمة">
                            <svg id="refreshIcon" class="w-4 h-4 transition-transform duration-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                            <span>تحديث يدوي</span>
                        </button>
                        
                        <div class="flex items-center gap-1.5 bg-gray-50 border border-gray-200 px-3 py-2 rounded-xl">
                            <span class="w-2.5 h-2.5 bg-blue-500 rounded-full"></span>
                            <h2 id="activeUsersTitle" class="text-xs sm:text-sm font-bold text-gray-800">المستخدمون (...)</h2>
                        </div>
                    </div>
                </div>
                <div id="activeUsersTableContainer" class="flex-1 overflow-auto border border-gray-200 rounded-2xl shadow-sm">
                    <div class="flex items-center justify-center h-full">
                        <p class="text-gray-500 text-sm">جاري جلب المتصلين الآن...</p>
                    </div>
                </div>
            `;
            loadDynamicMenuIntoSidebar();

            window.fetchAndUpdateActiveUsers = async function(isManual = false) {
                if (isManual) {
                    const icon = document.getElementById('refreshIcon');
                    if (icon) icon.classList.add('rotate-180');
                    setTimeout(() => {
                        if (icon) icon.classList.remove('rotate-180');
                    }, 500);
                }

                const { data: users, error } = await supabaseClient.rpc('get_active_users', {
                    p_user_id: currentUserId
                });

                if (error) {
                    console.error("خطأ في جلب المستخدمين النشطين:", error.message);
                    return;
                }

                let rowsHtml = "";
                if (users && users.length > 0) {
                    rowsHtml = users.map((user, index) => `
                        <tr class="${index % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-blue-50/50 transition-colors">
                            <td class="px-4 py-3 text-xs sm:text-sm text-indigo-600 font-bold whitespace-nowrap">${user.user_role || 'مستخدم'}</td>
                            <td class="px-4 py-3 text-xs sm:text-sm text-gray-800 font-bold whitespace-nowrap">${user.user_name || 'بدون اسم'}</td>
                            <td class="px-4 py-3 text-xs sm:text-sm text-gray-700 whitespace-nowrap">${user.shop_name || 'غير متوفر'}</td>
                            <td class="px-4 py-3 text-xs sm:text-sm text-gray-600">${user.shop_address || 'غير متوفر'}</td>
                            <td class="px-4 py-3 text-xs sm:text-sm text-gray-600 whitespace-nowrap">${user.shop_scope || 'غير متوفر'}</td>
                            <td class="px-4 py-3 text-xs sm:text-sm text-gray-600 whitespace-nowrap">${user.shop_city || 'غير متوفر'}</td>
                            <td class="px-4 py-3 text-xs sm:text-sm text-blue-600 font-semibold whitespace-nowrap" dir="ltr">${user.phone_number || ''}</td>
                        </tr>
                    `).join('');
                } else {
                    rowsHtml = `<tr><td colspan="7" class="text-center text-gray-400 py-6 text-sm">لا توجد نشاطات حالية</td></tr>`;
                }

                const titleEl = document.getElementById('activeUsersTitle');
                if (titleEl) {
                    titleEl.innerText = `المستخدمون النشطون (${users ? users.length : 0})`;
                }

                const tableContainerEl = document.getElementById('activeUsersTableContainer');
                if (tableContainerEl) {
                    tableContainerEl.innerHTML = `
                        <table class="w-full text-right border-collapse">
                            <thead class="bg-gray-100 sticky top-0 z-10 border-b border-gray-200">
                                <tr>
                                    <th class="px-4 py-3 text-xs sm:text-sm font-bold text-gray-700 whitespace-nowrap">الرتبة</th>
                                    <th class="px-4 py-3 text-xs sm:text-sm font-bold text-gray-700 whitespace-nowrap">الاسم</th>
                                    <th class="px-4 py-3 text-xs sm:text-sm font-bold text-gray-700 whitespace-nowrap">اسم المحل</th>
                                    <th class="px-4 py-3 text-xs sm:text-sm font-bold text-gray-700 whitespace-nowrap">عنوان المحل</th>
                                    <th class="px-4 py-3 text-xs sm:text-sm font-bold text-gray-700 whitespace-nowrap">نطاق المحل</th>
                                    <th class="px-4 py-3 text-xs sm:text-sm font-bold text-gray-700 whitespace-nowrap">المحافظة</th>
                                    <th class="px-4 py-3 text-xs sm:text-sm font-bold text-gray-700 whitespace-nowrap">رقم الهاتف</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-200">
                                ${rowsHtml}
                            </tbody>
                        </table>
                    `;
                }
            };

            await fetchAndUpdateActiveUsers(false);
        }

        async function renderLoginHistoryScreen() {
            if (!currentUserId) {
                alert("❌ خطأ: لم يتم جلب الـ ID.");
                return;
            }

            document.getElementById('appContainer').innerHTML = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        <span>رجوع</span>
                    </button>
                    <h2 class="text-sm sm:text-base font-bold text-gray-800">سجل تسجيل الدخول</h2>
                </div>
                <div class="flex-1 flex items-center justify-center">
                    <p class="text-gray-500 text-sm">جاري التحقق من الصلاحيات وجلب سجلات الدخول...</p>
                </div>
            `;
            loadDynamicMenuIntoSidebar();

            const { data: response, error } = await supabaseClient.rpc('get_login_history_data', {
                p_user_id: currentUserId
            });

            if (error) {
                alert(`❌ خطأ في الاتصال بقاعدة البيانات: ${error.message}`);
                renderMainDashboard();
                return;
            }

            if (!response || response.success === false) {
                alert(`⛔ تم رفض صلاحية عرض سجل الدخول بواسطة قاعدة البيانات!`);
                renderMainDashboard();
                return;
            }

            const historyData = response.data || [];

            let rowsHtml = "";
            if (historyData.length > 0) {
                rowsHtml = historyData.map((item, index) => {
                    let rawDate = item.login_time || item.last_login || item.created_at || '';
                    let formattedTime = rawDate ? rawDate.replace('T', ' ') : 'غير متوفر';

                    return `
                        <tr class="${index % 2 === 0 ? 'bg-white' : 'bg-gray-50'} hover:bg-blue-50/50 transition-colors">
                            <td class="px-4 py-3 text-xs sm:text-sm text-gray-600 whitespace-nowrap" dir="ltr">${formattedTime}</td>
                            <td class="px-4 py-3 text-xs sm:text-sm text-indigo-600 font-bold whitespace-nowrap">${item.user_role || 'غير محدد'}</td>
                            <td class="px-4 py-3 text-xs sm:text-sm text-gray-800 font-bold whitespace-nowrap">${item.user_name || item.name || 'بدون اسم'}</td>
                            <td class="px-4 py-3 text-xs sm:text-sm text-gray-700 whitespace-nowrap">${item.shop_name || 'غير متوفر'}</td>
                            <td class="px-4 py-3 text-xs sm:text-sm text-gray-600 whitespace-nowrap">${item.shop_address || item.address || 'غير متوفر'}</td>
                            <td class="px-4 py-3 text-xs sm:text-sm text-gray-600 whitespace-nowrap">${item.shop_scope || 'غير متوفر'}</td>
                            <td class="px-4 py-3 text-xs sm:text-sm text-gray-600 whitespace-nowrap">${item.shop_city || 'غير متوفر'}</td>
                            <td class="px-4 py-3 text-xs sm:text-sm text-blue-600 font-semibold whitespace-nowrap" dir="ltr">${item.phone_number || ''}</td>
                        </tr>
                    `;
                }).join('');
            } else {
                rowsHtml = `<tr><td colspan="8" class="text-center text-gray-400 py-6 text-sm">لا توجد سجلات متاحة حالياً</td></tr>`;
            }

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <div class="flex items-center gap-2">
                        <button onclick="renderMainDashboard()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                            <span>رجوع</span>
                        </button>
                        <button onclick="handleDeleteLoginHistory()" class="bg-red-600 hover:bg-red-700 text-white px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all shadow-sm flex items-center gap-1.5">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            <span>حذف السجل</span>
                        </button>
                    </div>
                    <h2 class="text-sm sm:text-base font-bold text-gray-800">سجل تسجيل الدخول</h2>
                </div>
                <div class="flex-1 overflow-auto border border-gray-200 rounded-2xl shadow-sm">
                    <table class="w-full text-right border-collapse">
                        <thead class="bg-gray-100 sticky top-0 z-10 border-b border-gray-200">
                            <tr>
                                <th class="px-4 py-3 text-xs sm:text-sm font-bold text-gray-700 whitespace-nowrap">اخر دخول</th>
                                <th class="px-4 py-3 text-xs sm:text-sm font-bold text-gray-700 whitespace-nowrap">الرتبة</th>
                                <th class="px-4 py-3 text-xs sm:text-sm font-bold text-gray-700 whitespace-nowrap">الاسم</th>

            const addressValue = document.getElementById('editShopAddress').value.trim();

                p_phone_number: phoneValue,
                p_shop_address: addressValue,
                p_shop_area: areaValue, 
                p_shop_city: cityValue,

        function switchTab(tab) {
            const loginForm = document.getElementById('loginFormContainer');
            const registerForm = document.getElementById('registerFormContainer');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const registerTabBtn = document.getElementById('registerTabBtn');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
                loginTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-blue-600 shadow-sm";
                registerTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 text-gray-500 hover:text-gray-700";
                
                if (localStorage.getItem('saved_phone')) {
                    const phoneInput = document.getElementById('loginPhone');
                    const passInput = document.getElementById('loginPassword');
                    const rememberCheckbox = document.getElementById('rememberMe');
                    
                    if (phoneInput) phoneInput.value = localStorage.getItem('saved_phone');
                    if (passInput) passInput.value = localStorage.getItem('saved_password');
                    if (rememberCheckbox) rememberCheckbox.checked = true;
                }
            } else {
                loginForm.classList.add('hidden');
                registerForm.classList.remove('hidden');
                registerTabBtn.className = "py-2.5 text-sm font-semibold rounded-xl transition-all duration-200 bg-white text-emerald-600 shadow-sm";

            }
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const rememberMe = document.getElementById('rememberMe')?.checked;

            if (rememberMe) {
                localStorage.setItem('saved_phone', phone);
                localStorage.setItem('saved_password', password);
            } else {
                localStorage.removeItem('saved_phone');
                localStorage.removeItem('saved_password');
            }

            const { data, error } = await supabaseClient.rpc('login_user', { 
                p_phone_number: phone, 
                p_password: password 
            });

            if (error) {
                alert(`❌ خطأ: ${error.message}`);
                return;
            }

            let resObj = data;
            if (Array.isArray(data)) {
                resObj = data[0];
            }

            if (!resObj || resObj.success === false) {
                alert(`⚠ بيانات الدخول غير صحيحة`);
                return;
            }

            currentUserRole = resObj.phone_number || phone;
            currentUserType = resObj.user_type || resObj.user_role || "head"; 
            currentUserId = resObj.user?.id || resObj.user_id || resObj.id || resObj.ID || resObj.uuid || null; 
            
            if (currentUserId) {
                startUserHeartbeat(currentUserId);
            }

            renderMainDashboard();
            loadDynamicMenuIntoSidebar(); 
        }

        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const user_name = document.getElementById('regUserName').value.trim();
            const shop_name = document.getElementById('regShopName').value.trim();
            const shop_address = document.getElementById('regShopAddress').value.trim();
            const shop_city = document.getElementById('regShopCity').value.trim();
            const phone_number = document.getElementById('regPhone').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            const { data, error } = await supabaseClient.rpc('register_user', { 
                p_user_name: user_name, 
                p_shop_name: shop_name, 
                p_shop_address: shop_address, 
                p_shop_city: shop_city,
                p_phone_number: phone_number, 
                p_password: password 
            });

            if (error) {
                alert(`❌ خطأ: ${error.message}`);
                return;
            }

            let resObj = data;
            if (Array.isArray(data)) {
                resObj = data[0];
            }

            if (resObj && resObj.success === false) {
                alert(`⚠ ${resObj.message || 'رفض إنشاء الحساب'}`);
                return;
            }

            alert('✅ تم إنشاء الحساب وتسجيل الدخول بنجاح!');
            currentUserRole = phone_number;
            currentUserType = "head"; 
            currentUserId = resObj?.user?.id || resObj?.id || resObj?.user_id || resObj?.ID || resObj?.uuid || null;
            
            if (currentUserId) {
                startUserHeartbeat(currentUserId);
            }

            renderMainDashboard();
            loadDynamicMenuIntoSidebar();
        }

        async function renderPartDetails(part) {
            selectedPart = part;
            
            let menuItems = [];
            try {
                const { data, error } = await supabaseClient.rpc('get_menu_items_by_part_name', {
                    p_part_name: part
                });
                if (!error && data) {
                    menuItems = data;
                } else {
                    console.error("خطأ في جلب عناصر القائمة لقطعة الغيار:", error?.message);
                }
            } catch (err) {
                console.error("خطأ استثنائي:", err);
            }

            let dynamicSectionsHtml = "";
            if (menuItems.length > 0) {
                dynamicSectionsHtml = menuItems.map((item, index) => {
                    const itemName = item.spare_part_menu_items || item.title || item.name || Object.values(item)[1];
                    const itemValue = item.value || item.content || item.description || "";
                    const style = getRotatingCardStyle(index);
                    
                    return `
                        <div class="w-full ${style.bg} border ${style.border} p-4 rounded-2xl shadow-sm flex items-center justify-between cursor-pointer transition-all text-sm sm:text-base mb-3 group">
                            <div class="text-right w-full ml-3">
                                <span class="font-bold text-gray-800 block">${itemName}</span>
                                ${itemValue ? `<span class="text-xs text-gray-600 block mt-0.5">${itemValue}</span>` : ''}
                            </div>
                            <svg class="w-5 h-5 ${style.icon} flex-shrink-0 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        </div>
                    `;
                }).join('');
            } else {
                dynamicSectionsHtml = `<div class="text-center text-gray-400 text-sm py-4">لا توجد بيانات مسجلة في قاعدة البيانات لهذه القطعة حالياً</div>`;
            }

            let postsHtml = "";
            try {
                const { data, error } = await supabaseClient
                    .from('posts')
                    .select('*')
                    .ilike('device_model', `%${selectedModel}%`)
                    .ilike('spare_part', `%${part}%`);

                if (!error && data && data.length > 0) {
                    postsHtml = data.map((post) => `
                        <div class="bg-white border border-gray-200 p-4 rounded-2xl shadow-sm space-y-2">
                            <h3 class="font-bold text-gray-800 text-base">${post.title || 'ملاحظة صيانة'}</h3>
                            <p class="text-gray-600 text-sm leading-relaxed">${post.content || post.description || ''}</p>
                        </div>
                    `).join('');
                } else {
                    postsHtml = `<div class="text-center text-gray-400 text-sm py-4">لا توجد ملاحظات صيانة إضافية مسجلة لهذه القطعة حالياً</div>`;
                }
            } catch (err) {
                postsHtml = `<div class="text-center text-red-400 text-sm py-4">حدث خطأ أثناء الاتصال</div>`;
            }

            const html = `
                ${getHeaderTemplate()}
                <div class="flex items-center justify-between mb-4 flex-shrink-0">
                    <button onclick="renderPartsScreen('${selectedModel}', '${encodeURIComponent(selectedModelCode)}', '${encodeURIComponent(currentScreenCompatibility)}', '${encodeURIComponent(currentBatteryModel)}')" class="bg-gray-100 hover:bg-gray-200 text-gray-700 px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold transition-all flex items-center gap-1.5">
                        <svg class="w-4 h-4 transform rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                        <span>رجوع</span>
                    </button>
                    <h2 class="text-sm sm:text-base font-bold text-gray-800">${selectedModel} - ${part}</h2>
                </div>
                <div class="flex-1 overflow-y-auto space-y-3 p-1">
                    ${dynamicSectionsHtml}
                    <div class="space-y-3">
                        ${postsHtml}
                    </div>
                </div>
            `;
            document.getElementById('appContainer').innerHTML = html;
            loadDynamicMenuIntoSidebar();
        }

        window.onload = function() {
            renderLoginScreen();
        };
    </script>
</body>
</html>
